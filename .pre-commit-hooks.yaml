# Loophole pre-commit hook (issue #53).
#
# `language: script` is interim: the package is not pip-installable yet
# (issue #21), so pre-commit cannot install it as a `language: python`
# hook. Once #21 lands, this should become a `language: python` hook
# whose entry is the installed `loophole` console script.
#
# The scanner takes a single path per invocation, so the hook entry is a
# small wrapper that scans each staged file in turn and fails the commit
# if any file has critical/high findings (the scanner's default exit
# behaviour: exit 1). A plain `loophole scan` entry would fail with an
# argparse error whenever more than one file is staged.
- id: loophole
  name: Loophole security scan
  description: Static security scan for hardcoded secrets, SQLi, XSS, command injection and more.
  entry: scripts/loophole-pre-commit.sh
  language: script
  types_or: [javascript, jsx, ts, tsx, python, go, php]
