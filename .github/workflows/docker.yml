name: Docker image smoke test

# Builds the official Dockerfile and smoke-tests it against the
# fixtures (issue #29). The vulnerable fixtures must produce findings
# and exit 1; the clean fixtures must produce no findings and exit 0.
# On a version tag (v*) or a published release, the smoke-tested image
# is also published to GHCR (issue #54). The publish job never runs
# for pull requests or branch pushes.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t loophole .

      - name: Verify image runs as a non-root user
        run: |
          id_output="$(docker run --rm --entrypoint id loophole)"
          echo "$id_output"
          echo "$id_output" | grep -q "uid=10001"

      - name: Verify entrypoint lists rules
        run: docker run --rm loophole scan --rules .

      - name: Smoke-test vulnerable fixture (must exit 1)
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/src" loophole scan /src/tests/fixtures/py_vuln.py
          test $? -eq 1

      - name: Smoke-test clean fixture (must exit 0)
        run: docker run --rm -v "$PWD:/src" loophole scan /src/tests/fixtures/py_clean.py

      - name: Smoke-test vulnerable fixture directory (must exit 1)
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/src" loophole scan /src/tests/fixtures
          test $? -eq 1

  publish:
    needs: docker
    # Only a published release or a v* tag push may publish. In
    # particular this never runs for pull requests (fork PRs get a
    # read-only GITHUB_TOKEN regardless) or for branch pushes.
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rootsiemen/loophole:${{ github.ref_name }}
            ghcr.io/rootsiemen/loophole:latest
